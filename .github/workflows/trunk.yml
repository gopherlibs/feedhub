name: "Trunk WF"

on:
  push:
    tags:
    - "*"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
    - uses: goreleaser/goreleaser-action@v6
      with:
        version: '2.7.0'
        args: "release --clean"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
